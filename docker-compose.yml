version: '3.8'

services:
  # PostgreSQL with Citus for multi-tenant scaling
  postgres:
    image: citusdata/citus:13.3
    container_name: hoa-postgres
    environment:
      POSTGRES_DB: hoa_platform
      POSTGRES_USER: hoa_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-citus.sql:/docker-entrypoint-initdb.d/init-citus.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoa_admin -d hoa_platform"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and real-time data
  redis:
    image: redis:7-alpine
    container_name: hoa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Platform application (main backend)
  platform:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: hoa-platform
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://hoa_admin:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/hoa_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      PLATFORM_PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev:platform

  # Admin application
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: hoa-admin
    environment:
      NODE_ENV: development
      PLATFORM_API_URL: http://platform:3000
      ADMIN_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - platform
    command: npm run dev:admin

  # Residence application
  residence:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: hoa-residence
    environment:
      NODE_ENV: development
      PLATFORM_API_URL: http://platform:3000
      RESIDENCE_PORT: 3002
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - platform
    command: npm run dev:residence

  # Sentinel application (security gate operations)
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: hoa-sentinel
    environment:
      NODE_ENV: development
      PLATFORM_API_URL: http://platform:3000
      SENTINEL_PORT: 3003
    ports:
      - "3003:3003"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - platform
    command: npm run dev:sentinel

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: hoa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - platform
      - admin
      - residence
      - sentinel

volumes:
  postgres_data:
  redis_data: